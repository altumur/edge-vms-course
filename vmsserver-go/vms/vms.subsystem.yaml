# The VMS, as the platform sees it. Everything the controller does for this
# subsystem is here; the worker (vmsworker) is the part that knows what a camera is:
# it HOLDS it — one connection, one fan-out, its events — and records nothing
# (rec.subsystem.yaml is the recorder's).
name: vms
unit:
  rows: cameras                      # vms/cameras/<id>
  id: numeric                        # vms/next_id
  fields:
    name:                  {type: string, default: "cam{id}"}
    # `type: url` is not decoration: it is what refuses `driverpack://root:hunter2@10.0.0.7/…` at the
    # door. This field IS in the snapshot below, and the snapshot leaves the cluster.
    source:                {type: url,    required: true}     # driverpack://file/<name> or driverpack://<vendor>/<host>
    enabled:               {type: bool,   default: true}
    events_retention_days: {type: int,    default: 365}       # buckets: the platform's, via the derived row below
    priority:              {type: int,    default: 100}
    labels:                {type: list}                       # where the camera is reachable from: "vlan:cctv-a"
    ref:                   {type: string}                     # the name a layer above knows it by (М12)
    # The device's own credential. Two fields and not one: a login identifies and a password
    # authenticates, and only the second has to be kept. The worker hands both to the actuator as element
    # PROPERTIES — never inside a launch string, which is what ends up in logs, a crash dump and `ps`.
    # Not in the snapshot below: nothing above the cluster reads it, and the snapshot is one object with a
    # 64 KiB ceiling — a field nobody consumes is paid for by every camera. "Not a secret" is a reason not
    # to hide it, never a reason to publish it.
    cred_username:         {type: string}                     # the device login
    cred_secret:           {type: string}                     # the device password: never in the snapshot, masked on the way out
    live:                  {type: string, default: "always"}  # always | on-demand
  derived:
    - row: retention/{id}            # vms/retention/<id> {days}: what the platform's resource job retains buckets by
      items: {days: events_retention_days}
      on_delete: {days: 0}           # a deleted camera's buckets go at the next pass
placement:
  capacity:   {from: capacity, fallback: 50}    # the worker's word, from its heartbeat; the fallback for one that said nothing
  headroom:   {from: headroom}                  # what the autoscaler sums
  constraint: labels-subset                     # the camera's labels ⊆ the worker's server's labels
  requires:   resource                          # the worker's server must have a resource that answers (for its events): not placed on while it is silent, moved off
  tie_break:  most-free-capacity
  # The camera has no home of its own: it goes where its RECORDING is. The anchor of the pair is the
  # recording, because it writes to a disk and a disk does not move; the fan-out can be read from anywhere
  # over RTSP, so the camera is the one that can follow.
  near:       rec                               # an affinity: the recorder holding this camera's recording
  home:       near                              # …and, unlike a bare affinity, maintained: EnsureHome follows it back
  rebalance:  {dead_band: 0.10}
snapshot: [name, source, enabled, events_retention_days, priority, labels, ref, live]
console:
  running: cameras_running             # vms_cameras_running: cameras held — streaming to whoever subscribes; recording is rec's gauge
