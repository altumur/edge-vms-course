# rec.subsystem.yaml — the recorder: the FOURTH subsystem, and the only one placed on top of the archive.
#
# A unit is one camera's recording, named by the camera: `rec/recordings/<cam>`. The recorder worker
# (`vms/recworker.py`, `recworker@`) subscribes to the camera's fan-out from whichever VMS worker holds it
# (the `live_url` in the VMS heartbeat — never a second connection to the camera), takes `rec/epoch/<cam>`,
# and writes footage into `rec/<cam>/e<epoch>/` on ITS server's archive, with the manifest beside it. The
# worker that holds the camera may be anywhere; the recorder must be where disks are — `requires: resource`
# — and one per VOLUME (`servers: distinct` over `place_by: volume`): a second recorder on the same disk is
# no second place to record, while a second one on another disk of the same box is exactly that. Retention of the footage is this row's `retention_days`, read by `ArchivePolicy` on the
# resource job; the camera's events are the worker's and retained by the VMS row's `events_retention_days`.
#
# Created by the operator: a camera exists without a recording (watched: live, detected, its events kept),
# and records when a row is here — from the page's Record toggle, which POSTs `/rec/recordings`.
name: rec
unit:
  rows: recordings                   # rec/recordings/<cam>
  id: cam                            # one recording per camera, named by it
  fields:
    cam:            {type: string, required: true}   # the VMS camera id
    retention_days: {type: int,    default: 30}      # media: the recorder's own policy, on its manifest
    enabled:        {type: bool,   default: true}
    labels:         {type: list}                     # where it may run: a recorder whose server has these labels
    home:           {type: string}                   # the VOLUME whose archive holds it — the operator's answer to "where does this footage live" (a storage tier, say)
placement:
  capacity:   {from: capacity, fallback: 50}         # cameras a recorder can write — its own number, from its heartbeat: disks and NIC
  headroom:   {from: headroom}
  constraint: labels-subset
  requires:   resource                               # the only subsystem that must be where the archive is
  place_by:   volume                                 # WHAT `distinct` and `home` count in: the disk, not the box —
                                                     # a server with three volumes runs three recorders, and one
                                                     # recording's worth of work goes to each. Reachability,
                                                     # draining and `spread_by` stay on the server: a volume has no
                                                     # address and cannot be drained on its own.
  servers:    distinct                               # one recorder per VOLUME carries recordings (the others idle)
  tie_break:  most-free-capacity
  # No `near`. A recorder does not follow a camera around: it is the one thing here that CANNOT move, being
  # pinned to disks (`requires: resource` above), and a fan-out can be read from any server over RTSP. So
  # the recording names the disk and the camera comes to it — `near: rec` in `vms.subsystem.yaml`. The pair
  # ends up on one server either way and the recorder reads shared memory; what changes is which of the two
  # decides, and it has to be the one with the disks.
  #
  # `home` is a preference, never a filter: a recording whose home is down is written elsewhere, which is
  # the whole reason the home may be down. It is MAINTAINED, unlike a bare affinity — `_pick` prefers a
  # recorder there when placing, `ensure_home(budget)` brings back, one recording a pass, what is written
  # somewhere else, so a server returning from an outage takes its recordings back without anybody running
  # a procedure. The filters (`labels-subset`, `spread_by`, `requires: resource`) still win: this only
  # orders what is already eligible. With no home, the pick is the disk with the most room.
  home:       home                                   # the row's field naming the volume whose archive holds it
  rebalance:  {dead_band: 0.10}
snapshot: [cam, retention_days, enabled, labels, home]
console:
  running: recordings_running          # rec_recordings_running: recordings whose pipeline is writing — what the health check reads
