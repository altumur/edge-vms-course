# rec.subsystem.yaml — the recorder: the FOURTH subsystem, and the only one placed on top of the archive.
#
# A unit is ONE RECORDING of one camera, named by the operator: `rec/recordings/<name>`. The recorder worker
# (`vms/recworker.py`, `recworker@`) subscribes to the camera's fan-out from whichever VMS worker holds it
# (the `live_url` in the VMS heartbeat — never a second connection to the camera), takes `rec/epoch/<name>`,
# and writes footage into `rec/<name>/e<epoch>/` on the archive it is homed to, with the manifest beside it.
# The worker that holds the camera may be anywhere; the recorder must be where disks are — `requires:
# resource` — and one per VOLUME (`servers: distinct` over `place_by: volume`): a second recorder on the
# same disk is no second place to record, while a second one on another disk of the same box is exactly
# that. Retention of the footage is this row's `retention_days`, read by `ArchivePolicy` on the resource
# job; the camera's events are the worker's and retained by the VMS row's `events_retention_days`.
#
# WHY A NAME AND NOT THE CAMERA. `id: cam` stood here while every camera had at most one recording, and it
# stopped being true the day an archive stopped meaning "this box's disks": with a network archive as a
# second volume, "camera 7 on the local disk" and "camera 7 in the network archive" are two recordings, of
# one camera, with their own retention, their own tree and their own epoch — and two rows cannot share the
# key `rec/recordings/7`. The name says which one it is; `cam` below says whose footage it holds. The two
# were always separate in the recorder (`enrich` reads both in three lines) — only the spec tied them.
#
# The page keeps the simple case simple: with no archive chosen the name IS the camera, so a box with one
# volume still writes `rec/recordings/7` and `rec/7/e1/…`, and the rule is visible in one place
# (`#recadd` in `console.html`) instead of hidden in a default here.
#
# Created by the operator: a camera exists without a recording (watched: live, detected, its events kept),
# and records when a row is here — from the page's Record form, which POSTs `/rec/recordings`.
name: rec
unit:
  rows: recordings                   # rec/recordings/<name>
  id: name                           # "7", "7-cloud" — the operator's name for THIS recording
  fields:
    name:           {type: string, required: true}   # which recording this is: its key, its epoch, its tree
    cam:            {type: string, required: true}   # WHOSE footage it holds — the VMS camera id
    retention_days: {type: int,    default: 30}      # media: the recorder's own policy, on its manifest
    enabled:        {type: bool,   default: true}
    labels:         {type: list}                     # where it may run: a recorder whose server has these labels
    home:           {type: string}                   # the VOLUME whose archive holds it — the operator's answer to "where does this footage live" (a storage tier, say)
placement:
  capacity:   {from: capacity, fallback: 50}         # cameras a recorder can write — its own number, from its heartbeat: disks and NIC
  headroom:   {from: headroom}
  constraint: labels-subset
  requires:   resource                               # the only subsystem that must be where the archive is
  place_by:   volume                                 # WHAT `distinct` and `home` count in: the disk, not the box —
                                                     # a server with three volumes runs three recorders, and one
                                                     # recording's worth of work goes to each. Reachability,
                                                     # draining and `spread_by` stay on the server: a volume has no
                                                     # address and cannot be drained on its own.
  servers:    distinct                               # one recorder per VOLUME carries recordings (the others idle)
  tie_break:  most-free-capacity
  # No `near`. A recorder does not follow a camera around: it is the one thing here that CANNOT move, being
  # pinned to disks (`requires: resource` above), and a fan-out can be read from any server over RTSP. So
  # the recording names the disk and the camera comes to it — `near: rec` in `vms.subsystem.yaml`. The pair
  # ends up on one server either way and the recorder reads shared memory; what changes is which of the two
  # decides, and it has to be the one with the disks.
  #
  # `home` is a preference, never a filter: a recording whose home is down is written elsewhere, which is
  # the whole reason the home may be down. It is MAINTAINED, unlike a bare affinity — `_pick` prefers a
  # recorder there when placing, `ensure_home(budget)` brings back, one recording a pass, what is written
  # somewhere else, so a server returning from an outage takes its recordings back without anybody running
  # a procedure. The filters (`labels-subset`, `spread_by`, `requires: resource`) still win: this only
  # orders what is already eligible. With no home, the pick is the disk with the most room.
  home:       home                                   # the row's field naming the volume whose archive holds it
  rebalance:  {dead_band: 0.10}
  # No `spread_by: cam`, deliberately, though `id: name` is what makes it possible. `spread_by` is a filter
  # over SERVERS — two recordings of one camera may not share a machine — and that is right for the reason
  # it exists (redundancy: a second copy on the failed server is not a second copy) and wrong for the
  # reason the name arrived here (a local volume and a network archive on the SAME box are two archives,
  # and the filter would refuse the pair outright). Which one the operator is buying is not visible from
  # the rows, so the spec does not guess: `home` names the volume for each recording, and an installation
  # that wants copies to survive a server adds the line — `/unplaceable` then says so out loud instead of
  # quietly putting both in one place.
snapshot: [name, cam, retention_days, enabled, labels, home]
console:
  running: recordings_running          # rec_recordings_running: recordings whose pipeline is writing — what the health check reads
