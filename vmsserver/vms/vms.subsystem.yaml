# The VMS, as the platform sees it. Everything the controller does for this
# subsystem is here; the worker (vmsworker) is the part that knows what a camera is.
# the prefix. `SubsystemSpec.sub` becomes `Subsystem("vms")`, so every key is `vms/…`: rows under
# `vms/cameras/`, `vms/next_id`, `vms/workers/<w>`, `vms/placement/<id>`, `vms/slots/<w>`, `vms/epoch/<id>`,
# `vms/idem/<key>`, `vms/retention/<id>`, and the object-store keys `vms/<w>/heartbeat` and `vms/snapshot`.
# It also prefixes every `/metrics` line (`vms_…`) and is the `<subsystem>` directory on the resource
# (`<archive>/vms/<cam>/…`). The two ACLs are cut from it: the console's token gets `vms/cameras/*`,
# `vms/next_id`, `vms/idem/*`, `vms/retention/*`; the controller's gets `vms/workers/*`, `vms/placement/*`,
# `vms/slots/*`.
name: vms
unit:
  # the row directory `vms/cameras/<id>` and the console's URL path: `GET/POST /cameras`, `PUT/DELETE
  # /cameras/<id>`; `/spec` reports `rows: "cameras"` and the page builds its list from it.
  # `SpecController._row_key` and `units()` list this prefix.
  rows: cameras                      # vms/cameras/<id>
  # ids are integers issued by `SpecController._next_id`, a CAS bump on `vms/next_id {n}`. A `POST` body
  # carrying `id` is refused (it is a platform field). `parse_id` turns the URL's last segment into an
  # `int`; sort order is numeric.
  id: numeric                        # vms/next_id
  # the operator's eleven fields. `SubsystemSpec.refuse` rejects any key not in this list and any of
  # `PLATFORM_FIELDS`; `new_row` applies the defaults; `row()`/`items()` convert by type; `/spec` sends
  # `{name, type, default, required}` for each so the page builds its forms without knowing the VMS.
  fields:
    # `{id}` is substituted with the issued id in `new_row` (the default is kept as a string in `from_dict`
    # for exactly this). The worker's heartbeat status echoes it.
    name:                  {type: string, default: "cam{id}"}
    # the only required field: a create without it is `Refused("a vms unit needs a source")`. The worker
    # passes it verbatim as `driverpacksrc uri=…`; `gstvms/uri.py` accepts `driverpack://file/<name>` and
    # refuses `driverpack://<vendor>/…` as the real DriverPack's.
    # `type: url` is not decoration: it is what refuses `driverpack://root:hunter2@10.0.0.7/…` at the
    # door. This field IS in the snapshot below, and the snapshot leaves the cluster — a password pasted
    # in here would reach М12's directory and every console screen, past a mask that only looks at
    # `*_secret`. The credential goes in the two fields below instead.
    source:                {type: url,    required: true}     # driverpack://file/<name> or driverpack://<vendor>/<host>
    # the reconciler only starts enabled rows and stops what is disabled; the worker reports `phase:
    # pending` for a disabled camera. `PUT {"enabled": false}` bumps `revision` and the worker stops the
    # pipeline.
    enabled:               {type: bool,   default: true}
    # media retention: the VMS's own policy, applied by `ArchiveResource.retain` (`ArchivePolicy.pass_`
    # reads it straight from `vms/cameras/<cam>`; `__main__.retain` reads it through `config.row`). The
    # controller only stores it.
    # bucket retention: the platform's, via the derived row below. Events are small and kept a year where
    # footage is kept a month.
    events_retention_days: {type: int,    default: 365}       # buckets: the platform's, via the derived row below
    # stored and carried in the snapshot; nothing in М10 reads it (no placement rule uses it).
    priority:              {type: int,    default: 100}
    # where the camera is reachable from (`"vlan:cctv-a"`); the placement constraint below compares it
    # against the worker's server labels. Accepts a JSON list or a comma-separated string; stored
    # comma-joined.
    labels:                {type: list}                       # where the camera is reachable from: "vlan:cctv-a"
    # The operator's grouping — «Подъезд», «Улица», «Объект А». A separate key from `labels`, and not
    # because it is tidier: `labels` are MATCHED by placement (`labels-subset` below) against what a server
    # declares about itself, and a server declares two kinds of fact there — which segments it reaches
    # (`vlan:cctv-a`) and what it has (`gpu`). Put a folder in that set and the camera becomes unplaceable
    # until some server claims to reach «Подъезд»: an absurdity that arrives looking like a placement
    # failure, which is the most expensive kind of wrong.
    #
    # And no `loc:` prefix. A prefix would exist only to smuggle folders past a field that is matched;
    # with a key of their own it carries no information, and a prefix carrying no information is a thing
    # to get wrong (`Loc:`, `loc :`) with no one to refuse it.
    #
    # Nothing in М10 reads it — like `priority`. Stored, and shown by the console because the page builds
    # its form from `/spec`. Flat list: whether folders nest is not decided here, and a separator would be
    # the decision.
    #
    # NOT in the snapshot below, and that was measured rather than chosen: the snapshot is one object per
    # worker under a 64 KiB ceiling, `test_the_shard_fits_where_the_one_object_did_not` holds it to a third
    # of that, and this field pushed the biggest shard from 20.9 to 21.7 KiB — past the line. The margin is
    # there so the shape survives the next field; spending it on a field nothing reads, to loosen a test
    # written to measure exactly this, would be the wrong trade. When М12's directory wants folders, put it
    # in and re-measure — that is a decision with a number attached, which is what the test is for.
    folders:               {type: list}                       # the operator's grouping: "Подъезд,Улица"
    # Which of this device's event kinds are ALARMS (`w2cplatform/events.py`: the platform fixes the
    # vocabulary, the unit says which of its lines belong to which class). A list of kinds, empty by
    # default — a camera observes, and observing is not alarming.
    #
    # It lives on the UNIT and not in this spec's `events:` section, because the class is a property of
    # how the device was WIRED, not of the event type: `io.input` is an alarm on a door contact and noise
    # on a technological sensor that reports the same way. Written here as a constant, a perimeter camera
    # and a corridor camera would have to be two subsystems to be told apart.
    alarms:                {type: list}                       # kinds that are alarms on THIS device: "io.input,silent"
    # the name a layer above (М12) knows the camera by; the worker copies it into each status entry, and it
    # leaves the cluster in the snapshot.
    ref:                   {type: string}                     # the name a layer above knows it by (М12)
    # The device's own credential. Two fields and not one, because they are not the same KIND of thing: a
    # login identifies and a password authenticates, and only the second has to be kept. `mask_secrets`
    # keeps the secret off every reply the console sends. The worker hands both to the actuator as element
    # PROPERTIES — never inside a launch string, which is what ends up in logs, in a crash dump and in `ps`.
    # Not in the snapshot below: nothing above the cluster reads it, and the snapshot is one object with a
    # 64 KiB ceiling — a field nobody consumes is paid for by every camera. "Not a secret" is a reason not
    # to hide it, never a reason to publish it.
    cred_username:         {type: string}                     # the device login
    cred_secret:           {type: string}                     # the device password: never in the snapshot, masked on the way out
    # `always` (the default) or `on-demand`. A channel of an NVR kept only for its archive needs no live
    # pipeline: the worker still HOLDS the device — its session, its playback, its coverage — and reports the
    # camera as `held`. Thirty-two channels imported for their footage would otherwise be thirty-two streams
    # nobody watches.
    live:                  {type: string, default: "always"}  # always | on-demand
    # WHAT THIS DEVICE IS, and the reason the field exists at all: not every device has a picture. A door
    # controller, a fire panel, a relay board are IP devices integrated the same way, through the same
    # DriverPack, and they need everything a camera needs except the one thing the subsystem is named
    # after — they are held (one connection), they take an epoch, they are placed, and they write events.
    #
    # So the unit of this subsystem is a DEVICE, and a camera is the common case. `video` keeps every row
    # ever written meaning exactly what it meant; `io` says "no stream here", and the one thing that
    # changes is that the worker publishes no fan-out for it — see `enrich`. Nothing else in the system
    # needs a new branch, because everything else already asks the heartbeat rather than the row: the
    # recorder looks for `live_url` and does not find one, the gateway the same, the page the same.
    #
    # Deliberately NOT a list of capabilities. What a device can do — two inputs, one relay, PTZ — is a
    # DISCOVERY and belongs in the holder's `device_status()`, beside the channels it found. The row is
    # what the operator declared; the heartbeat is what the process saw.
    kind:                  {type: string, default: "video"}   # video | io — a device without a picture is still a device
  # rows the platform keeps beside the unit (`SpecController._derived`).
  derived:
    - row: retention/{id}            # vms/retention/<id> {days}: what the platform's resource job retains buckets by
      # the row is `{days: "<events_retention_days>"}`.
      items: {days: events_retention_days}
      # on `delete_camera` the row becomes `{days: 0}`, so a deleted camera's buckets go at the resource's
      # next pass without anyone deleting files by hand.
      on_delete: {days: 0}           # a deleted camera's buckets go at the next pass
placement:
  # `SpecController.capacity_of(worker)` reads `extra["capacity"]` from the worker's latest heartbeat (any
  # age); a worker that never said anything counts as 50 (the constructor's `capacity` argument overrides
  # the fallback). `test_capacity_is_the_workers_word_not_the_controllers`: workers saying 2 and 6 are
  # filled to 2 and 6; unknown `w-9` is 50.
  capacity:   {from: capacity, fallback: 50}    # the worker's word, from its heartbeat; the fallback for one that said nothing
  # `SpecController.headroom()` sums `extra["headroom"]` over workers seen in the last 45 s; the console
  # exports it as `vms_headroom` and `vms_worker_headroom{worker,server}` — what the autoscaler sums. The
  # worker computes it as `capacity − len(rows)`.
  headroom:   {from: headroom}                  # what the autoscaler sums
  # chosen by name from `CONSTRAINTS`: a worker is eligible for a camera only if the camera's `labels` ⊆ the
  # labels in the worker's heartbeat (from `NOMAD_META_labels`). The placement reason names the labels
  # reached; `unplaceable()` lists cameras no live worker's labels can serve.
  constraint: labels-subset                     # the camera's labels ⊆ the worker's server's labels
  # ONE CONNECTION PER DEVICE, and this is the line that makes it true. A recorder with sixteen channels
  # is sixteen rows; without this they are placed by capacity alone, land on four workers, and open four
  # sessions to a box that licenses two. The failure then arrives in the device's words — "too many
  # sessions", a channel that will not start, a stream that drops when the fifth is added — and nothing
  # in it points at a placement decision made on another server an hour earlier.
  #
  # `device` is not a field: `VmsController.group_value` parses it out of `driverpack://<device>/<channel>`,
  # because the scheme is the subsystem's business and not the platform's. A row with no source groups
  # with nothing, which is what a half-created camera should do.
  group_by:   device                            # channels of one device go to ONE worker — it is one connection
  # a worker records into the resource on its own server: Nomad's `meta.archive` constraint puts it where
  # disks are declared, and this is the live fact — a worker whose server's resource has gone silent is
  # not placed on, and its cameras are moved off on the controller's next pass (`redistribute`).
  requires:   resource                          # the worker's server must have a resource that answers
  # `_best`: among eligible workers the one with the largest `capacity − load`, strictly positive; ties to
  # the first in sorted order. The only tie-break the catalogue has.
  tie_break:  most-free-capacity
  # the camera has no home of its own: it goes where its RECORDING is. The anchor of the pair is the
  # recording, because it writes to a disk and a disk does not move; the fan-out can be read from anywhere
  # over RTSP, so the camera is the one that can follow. Both together mean the recorder reads shared
  # memory instead of the network, and after an outage the pair comes back in that order — the recording
  # to the server its row names, the camera behind it, one a pass.
  # `of: cam`, not a bare `near: rec`: a recording is named by the operator now (`id: name`), so "the rec
  # unit with my id" is a coincidence — true while a camera has one recording called `7`, false the moment
  # it also has `7-cloud`, and silently false, which is worse. `of` reads the recorder's status entry and
  # takes the recording whose `cam` is this camera, whatever it is called. Two of them: the smallest id,
  # and the other one reads the same fan-out over the network.
  near:       {sub: rec, of: cam}               # an affinity: the recorder running a recording OF this camera
  home:       near                              # …and, unlike a bare affinity, maintained: `ensure_home` follows it back
  # `rebalance(budget)` stops when the spread in `load/capacity` between the most and least loaded workers
  # is under 10 %. Rebalance runs only when asked, never in the controller's pass.
  rebalance:  {dead_band: 0.10}
# The fields `SpecController.snapshot()` copies out of each row into `vms/snapshot` (object store), with
# `id`, `revision`, `worker` and `server` added by the controller. All eight operator fields here; it is the
# copy that leaves the cluster (М12), never the rows themselves. `publish_snapshot` runs in every controller
# pass.
snapshot: [name, source, enabled, events_retention_days, priority, labels, alarms, ref, live, kind]
console:
  # the name of the running gauge: `metrics_text()` emits `vms_cameras_running <n>` for status entries in
  # phase `running` on live workers (`test_the_console_over_http` sees `vms_cameras_running 1`); `/spec`
  # sends it as `metrics.running` so the page's status line knows which metric to read. Default would have
  # been `units_running`.
  running: cameras_running             # vms_cameras_running: cameras held — streaming to whoever subscribes; recording is rec's gauge

events:
  # Which of this subsystem's events collapse when they repeat. A storm is normal, not a fault, and the
  # only place a repeat costs nothing to recognise is the worker holding the device — one line before the
  # write (`w2cplatform/events.py`, `Suppressor`; М10A, урок 12).
  #
  # The first line of every window goes into the log immediately and unchanged: whatever the repeats are
  # worth, the first occurrence is the observation. What was swallowed is said when the window closes —
  # one line carrying `repeats`, `since` and `until`, so a quiet log and a suppressed storm are different
  # things on the timeline.
  #
  # `by` is left out everywhere here, which means "every field of the line": two lines collapse only when
  # they are identical. A contact that opens and then closes differs in `value` and is never one event;
  # only the same reading, repeated, is.
  suppress:
    io.input:
      window: 30                       # a contact bounces for milliseconds and a bad one for hours; thirty
                                       # seconds is long enough that a swinging gate is one line per window,
                                       # short enough that a door genuinely used twice a minute is two.
    silent:
      window: 60                       # a camera that cannot be reached posts this every pass — once every
                                       # two seconds, for as long as the network is down. The first one is
                                       # the news; the next thirty are the same news.

# ================================================================================================
# NOTES — what every part of this file does and why (kept beside the code, not in a separate document)
# ================================================================================================
# # vms.subsystem.yaml — the VMS's controller, as a spec: what `SpecController` and `SpecConsole` run from
#
# **Role.** Lesson 6. The one file a subsystem gives the platform. `vms/config.py` loads it into
# `SubsystemSpec` at import (`SPEC`); `VmsController` is `SpecController(SPEC, …)` and the console is
# `SpecConsole` over the same controller (see `w2cplatform/spec.py` and `console.py` for what each class
# does with each section). Its header comment draws the line: "Everything the controller does for this
# subsystem is here; the worker (vmsworker) is the part that knows what a camera is." Nothing in the file
# says how a camera records. `live.subsystem.yaml` and `det.subsystem.yaml` prove the same classes run two more subsystems from a
# different dict.
#
# - `row: retention/{id}` — `vms/retention/<id>`, written on create and refreshed on update only when a
#   source field changed. This is the row the platform's resource job reads for bucket retention
#   (`w2cplatform.resource.retention_days`: the unit's row, else the subsystem's `vms/retention`, else a
#   year). Its first path segment, `vms/retention/*`, is in the console's ACL because the console's token
#   creates cameras.
#
# ## Notes
# - Key layout summary from `config.py`'s docstring: `vms/cameras/<id>` (row), `vms/workers/<w>`
#   (assignment), `vms/placement/<id>`, `vms/retention/<id>`, `vms/epoch/<id>` (a worker takes by CAS),
#   `vms/next_id`.
# - Fields the operator may never send, whatever the YAML says: `worker, placement, epoch, revision,
#   observed_revision, phase, id` (`PLATFORM_FIELDS`). Those are the controller's (placement, with a reason)
#   or the worker's (phase, epoch, observed_revision in its heartbeat).
# - Editing this file changes the controller and the console together and requires no Python change;
#   `config.OPERATOR_FIELDS` follows it.
# ================================================================================================
